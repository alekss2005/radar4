<!DOCTYPE html>
<html lang="uk" data-theme="military">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>KYIV OSINT RADAR v15.6</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
:root,[data-theme="military"]{--bg:#050a10;--panel:rgba(8,16,24,.92);--panel-solid:#0b1520;--text:#e8f0f5;--muted:#7a8f9e;--accent:#22d3ee;--accent-soft:rgba(34,211,238,.15);--danger:#ef4444;--ok:#34d399;--warn:#fbbf24;--border:rgba(34,211,238,.18);--header-bg:rgba(5,10,16,.94);--btn-bg:rgba(12,22,32,.9);--btn-border:rgba(148,163,184,.22);--event-border:#132028;--glow:0 0 12px rgba(34,211,238,.35);--radius:12px;--font:"SF Mono",ui-monospace,Menlo,Consolas,monospace;--font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;font-family:var(--font-ui);background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}
#app{position:absolute;inset:0;display:flex;flex-direction:column}
.header{min-height:42px;background:var(--header-bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:6px 12px;padding-top:calc(6px + var(--safe-top));z-index:1000;backdrop-filter:blur(16px);flex:0 0 auto;font-size:12px;gap:8px}
.logo{font-weight:800;font-size:11px;display:flex;align-items:center;gap:7px;white-space:nowrap;font-family:var(--font)}
.logo-icon{font-size:14px;filter:drop-shadow(0 0 6px var(--accent))}
.header-right{display:flex;align-items:center;gap:8px;flex:1;justify-content:flex-end;min-width:0}
.search-box{display:flex;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:999px;overflow:hidden;height:32px;flex:1;max-width:260px;min-width:100px}
.search-box input{background:transparent;border:0;color:var(--text);padding:0 12px;font-size:12px;width:100%;outline:none}
.search-box input::placeholder{color:var(--muted)}
.search-box button{background:transparent;border:0;color:var(--accent);width:34px;height:32px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
.lang-btn-header{background:var(--btn-bg);border:1px solid var(--border);color:var(--accent);border-radius:999px;font-size:11px;cursor:pointer;font-weight:800;width:34px;height:32px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--font)}
.status{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);font-weight:700;white-space:nowrap;font-family:var(--font)}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.status-dot.err{background:var(--danger);box-shadow:0 0 10px var(--danger)}
.status-dot.warn{background:var(--warn);box-shadow:0 0 10px var(--warn)}
.ballistic-timer{display:none;padding:0 10px;height:32px;border-radius:999px;align-items:center;justify-content:center;font-family:var(--font);font-weight:900;font-size:12px;color:#fff;background:#7c2d12;border:2px solid #fca5a5;box-shadow:0 0 12px rgba(220,38,38,.7);flex:0 0 auto;min-width:66px;white-space:nowrap;animation:btPulse 1s ease-in-out infinite}
.ballistic-timer.show{display:inline-flex}
@keyframes btPulse{0%,100%{box-shadow:0 0 12px rgba(220,38,38,.7);transform:scale(1)}50%{box-shadow:0 0 24px rgba(220,38,38,1);transform:scale(1.04)}}
.search-results{position:absolute;top:calc(48px + var(--safe-top));right:10px;left:10px;z-index:5000;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);max-width:400px;margin-left:auto;max-height:260px;overflow-y:auto;width:280px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.55)}
.search-results.show{display:block}
.search-item{padding:9px 12px;cursor:pointer;font-size:12px;border-bottom:1px solid rgba(148,163,184,.12)}
.search-item:hover{background:rgba(59,130,246,.18)}
.search-item .name{font-weight:700}
.search-item .addr{font-size:10px;color:var(--muted);margin-top:2px}
#map{flex:1;min-height:0;width:100%;background:var(--bg)}
[data-theme="military"] #map{background:#dbe4ee}
.top-alert{position:absolute;top:calc(48px + var(--safe-top) + 8px);left:6px;right:6px;z-index:4600;border-radius:10px;overflow:hidden;display:none;box-shadow:0 6px 24px rgba(0,0,0,.5);backdrop-filter:blur(10px)}
.top-alert.show{display:block;animation:alertIn .3s ease-out}
@keyframes alertIn{from{transform:translateY(-8px);opacity:0}to{transform:translateY(0);opacity:1}}
.top-alert.ballistic{background:linear-gradient(90deg,#7f1d1d,#dc2626,#7f1d1d);color:#fff;animation:bbPulse .6s ease-in-out infinite;border:1px solid #fca5a5}
@keyframes bbPulse{0%,100%{background:linear-gradient(90deg,#7f1d1d,#dc2626,#7f1d1d)}50%{background:linear-gradient(90deg,#dc2626,#fca5a5,#dc2626)}}
.top-alert.impact{background:linear-gradient(90deg,#7c2d12,#ea580c,#7c2d12);color:#fff;border:1px solid #fdba74}
.top-alert.falling{background:linear-gradient(90deg,#78350f,#f59e0b,#78350f);color:#fff;border:1px solid #fcd34d}
.top-alert.shot{background:linear-gradient(90deg,#14532d,#16a34a,#14532d);color:#fff;border:1px solid #86efac}
.top-alert.fire{background:linear-gradient(90deg,#7c2d12,#f97316,#7c2d12);color:#fff;border:1px solid #fdba74}
.top-alert-inner{padding:9px 34px 9px 12px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:.86rem;line-height:1.25}
.top-alert-icon{font-size:1.4rem;flex-shrink:0}
.top-alert-body{flex:1;min-width:0}
.top-alert-title{font-weight:800;font-size:.86rem}
.top-alert-place,.top-alert-meta{font-size:.78rem;font-weight:700;margin-top:2px;opacity:.95}
.top-alert-close{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.25);border:0;color:#fff;width:22px;height:22px;border-radius:50%;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.mass-banner{position:absolute;top:calc(36px + var(--safe-top) + 6px);left:6px;right:6px;z-index:4620;border-radius:10px;overflow:hidden;display:none;box-shadow:0 6px 24px rgba(0,0,0,.6);background:linear-gradient(135deg,#4c1d95,#7c3aed,#4c1d95);border:1px solid #c4b5fd;color:#fff}
.mass-banner.show{display:block;animation:alertIn .3s ease-out}
.mass-banner-inner{padding:10px 34px 10px 12px;display:flex;align-items:flex-start;gap:10px;font-weight:700;font-size:.8rem}
.mass-banner-icon{font-size:1.5rem}
.mass-banner-body{flex:1;min-width:0}
.mass-banner-title{font-weight:800;font-size:.86rem}
.mass-banner-line{font-size:.74rem;font-weight:700;margin-top:3px;opacity:.95}
.mass-banner-line b{color:#fde047}
.mass-banner-close{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.3);border:0;color:#fff;width:22px;height:22px;border-radius:50%;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.panel{position:absolute;left:6px;right:6px;bottom:calc(54px + var(--safe-bottom));background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;z-index:900;backdrop-filter:blur(18px);display:flex;flex-direction:column;max-height:20vh;transition:max-height .22s ease;box-shadow:0 8px 32px rgba(0,0,0,.35)}
.panel.collapsed{max-height:40px}
.panel-header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;height:40px;flex:0 0 40px}
.panel-title{font-size:12px;font-weight:800;letter-spacing:.06em;display:flex;align-items:center;gap:6px;font-family:var(--font);text-transform:uppercase}
.panel-count{font-size:11px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:5px}
.panel-chev{font-size:.7rem;color:var(--muted);transition:transform .2s}
.panel.collapsed .panel-chev{transform:rotate(-90deg)}
.events{overflow-y:auto;flex:1;min-height:0;padding:4px 8px 8px}
.event{padding:10px 12px;margin-bottom:6px;border-radius:10px;border:1px solid var(--event-border);border-left:3px solid var(--accent);cursor:pointer;background:rgba(0,0,0,.2)}
.event:hover{background:var(--accent-soft)}
.event-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.event-type{font-weight:800;font-size:12px;display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.event-icon{font-size:13px}
.event-time{font-size:10px;color:var(--muted);font-weight:700;font-family:var(--font)}
.event-loc{margin-top:3px;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.event-meta{margin-top:3px;display:flex;gap:3px;flex-wrap:wrap}
.tag{padding:1px 5px;border-radius:4px;background:#132630;color:#8faab8;font-size:8px;font-weight:700}
.tag.seed{background:rgba(168,85,247,.35);color:#e9d5ff}
.tag.approx{background:rgba(251,191,36,.35);color:#fbbf24}
.panel-empty{padding:14px 10px;text-align:center;color:var(--muted);font-size:10px}
.hud-bottom{position:absolute;bottom:calc(14px + var(--safe-bottom));left:0;right:0;z-index:1000;padding:0 6px;pointer-events:none}
.hud-bottom>*{pointer-events:auto}
.btn-row{display:flex;gap:4px;overflow-x:auto;padding:4px 6px;background:var(--panel);border:1px solid var(--border);border-radius:999px;backdrop-filter:blur(18px);box-shadow:0 6px 20px rgba(0,0,0,.4);scrollbar-width:none;width:100%}
.btn-row::-webkit-scrollbar{display:none}
.btn-row button{border-radius:999px;min-width:36px;height:36px;flex:1;border-color:transparent;background:transparent}
button{background:var(--btn-bg);border:1px solid var(--btn-border);color:var(--text);border-radius:var(--radius);font-size:.95rem;cursor:pointer;font-weight:700;min-width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;padding:0}
button:active{background:var(--accent-soft)}
button.danger{color:#fca5a5}
button.on{border-color:var(--accent);box-shadow:var(--glow);background:var(--accent-soft)}
button.sound-btn.on{color:var(--ok)}
button.sound-btn.muted{color:var(--danger);border-color:transparent;background:var(--btn-bg)}
button.geo-btn.on{background:rgba(34,211,238,.9);color:#04202a;border-color:#22d3ee;box-shadow:0 0 14px rgba(34,211,238,.7)}
button.siren-btn{color:var(--danger)}
button.fs-btn.on{background:rgba(99,102,241,.9);color:#fff}
button.hist-btn.on{background:rgba(16,185,129,.85);color:#fff}
button.stockpile-btn.on{background:rgba(250,204,21,.9);color:#1f2937;border-color:#facc15;box-shadow:0 0 14px rgba(250,204,21,.7)}
.dev-signature{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:9px;font-weight:700;letter-spacing:.1em;pointer-events:none;z-index:1100;font-family:var(--font);padding:1px 0 calc(1px + var(--safe-bottom));color:#3b82f6;opacity:.9}
.leaflet-popup-content-wrapper{background:var(--panel-solid);color:var(--text);border-radius:var(--radius);border:1px solid var(--border);box-shadow:0 8px 28px rgba(0,0,0,.55)}
.leaflet-popup-tip{background:rgba(7,16,24,.97)}
.leaflet-popup-content{margin:9px 11px;font-size:.75rem;line-height:1.4;max-width:250px}
.leaflet-popup-close-button{color:#94a3b8!important;font-size:18px!important;padding:2px 6px!important}
.popup-title{font-weight:700;font-size:.82rem;margin-bottom:4px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.popup-meta{color:#94a3b8;font-size:.68rem}
.popup-channels{margin-top:6px;padding-top:5px;border-top:1px solid rgba(148,163,184,.18);font-size:.66rem}
.popup-channels .ch{display:inline-block;background:rgba(148,163,184,.2);color:#cbd5e1;padding:1px 6px;border-radius:8px;margin:2px 2px 2px 0;border:1px solid rgba(148,163,184,.3)}
.popup-remove-btn{margin-top:8px;width:100%;height:30px;font-size:.75rem;background:rgba(220,38,38,.25);border:1px solid rgba(248,113,113,.5);color:#fca5a5;border-radius:6px;cursor:pointer;font-weight:800}
.popup-user-rel{background:rgba(34,211,238,.22);color:#67e8f9;padding:3px 6px;border-radius:5px;font-weight:800;font-size:.7rem;display:inline-block;margin-top:4px;border:1px solid rgba(34,211,238,.55)}
.threat-wrap{position:relative;width:28px;height:28px}
.threat-rotate{position:absolute;inset:0;transform-origin:center center}
.threat-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 0 5px rgba(0,0,0,.5));transform-origin:center center;position:relative;animation:pulse 1.8s ease-in-out infinite}
.threat-icon svg{width:24px;height:24px;display:block}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 3px rgba(0,0,0,.5));opacity:1}50%{filter:drop-shadow(0 0 8px rgba(251,191,36,.55));opacity:.92}}
.threat-icon.approx{opacity:.75;filter:grayscale(.3) drop-shadow(0 0 5px rgba(251,191,36,.7))}
.threat-icon.near-user-far::before{content:"";position:absolute;inset:-5px;border:2px solid #facc15;border-radius:50%;box-shadow:0 0 10px rgba(250,204,21,.9);animation:nearUserFarPulse 1.8s ease-in-out infinite;pointer-events:none}
@keyframes nearUserFarPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.12);opacity:.6}}
.threat-icon.near-user-near::before{content:"";position:absolute;inset:-5px;border:2px solid #dc2626;border-radius:50%;box-shadow:0 0 12px rgba(220,38,38,.95);animation:nearUserNearPulse 1.1s ease-in-out infinite;pointer-events:none}
@keyframes nearUserNearPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.18);opacity:.5}}
.threat-icon.ballistic-alarm{animation:ballisticAlarmPulse .5s ease-in-out infinite}
@keyframes ballisticAlarmPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 6px rgba(220,38,38,1))}50%{transform:scale(1.2);filter:drop-shadow(0 0 16px rgba(220,38,38,1));opacity:.75}}
.stockpile-marker{width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:18px;filter:drop-shadow(0 0 5px rgba(250,204,21,.9));position:relative;cursor:pointer}
.stockpile-marker.high{filter:drop-shadow(0 0 7px rgba(220,38,38,1))}
.stockpile-marker.mid{filter:drop-shadow(0 0 6px rgba(251,191,36,1))}
.stockpile-marker.low{filter:drop-shadow(0 0 5px rgba(59,130,246,.9))}
.stockpile-badge{position:absolute;right:-8px;top:-8px;min-width:18px;height:16px;padding:0 4px;border-radius:8px;background:#dc2626;color:#fff;font-size:9px;font-weight:900;display:flex;align-items:center;justify-content:center;border:1px solid #fff;z-index:5;box-shadow:0 0 6px rgba(220,38,38,.8)}
.stockpile-pulse{animation:stockpilePulse 1.5s ease-in-out infinite}
@keyframes stockpilePulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 8px rgba(220,38,38,1))}50%{transform:scale(1.15);filter:drop-shadow(0 0 18px rgba(220,38,38,1))}}
.err-banner{position:absolute;top:calc(36px + var(--safe-top));left:0;right:0;z-index:5000;background:#b91c1c;color:#fff;padding:8px 10px;font-size:.72rem;display:none}
.err-banner.show{display:block}
.err-banner .err-close{float:right;background:0;border:0;color:#fff;font-size:1.1rem;cursor:pointer;padding:0 4px}
.toast{position:absolute;left:50%;top:calc(48px + var(--safe-top) + 12px);transform:translateX(-50%);z-index:2000;background:var(--panel-solid);color:var(--text);padding:9px 14px;border-radius:999px;border:1px solid var(--border);font-size:12px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .25s;pointer-events:none;max-width:85vw;text-align:center}
.toast.show{opacity:1}
.ai-modal-backdrop{position:fixed;inset:0;z-index:3000;background:rgba(15,23,42,.7);display:none;align-items:center;justify-content:center;padding:12px}
.ai-modal-backdrop.show{display:flex}
.ai-modal{background:rgba(15,23,42,.98);color:#e2e8f0;border:1px solid rgba(148,163,184,.3);border-radius:12px;max-width:460px;width:100%;max-height:80vh;overflow:hidden;display:flex;flex-direction:column}
.ai-modal-header{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid rgba(148,163,184,.2)}
.ai-modal-title{flex:1;font-weight:700;font-size:.88rem}
.ai-modal-close{background:0;border:0;color:#94a3b8;font-size:1.4rem;cursor:pointer;padding:0 4px}
.ai-modal-body{padding:11px 13px;overflow-y:auto;font-size:.82rem;line-height:1.5;white-space:pre-wrap;font-family:var(--font)}
.ai-modal-footer{padding:9px 13px;border-top:1px solid rgba(148,163,184,.2);display:flex;justify-content:space-between;align-items:center;font-size:.66rem;color:#94a3b8}
.ai-modal-footer button{font-size:.72rem;padding:5px 10px;min-width:auto;height:auto}
.leaflet-control-attribution{font-size:8px!important;background:var(--panel)!important;color:var(--muted)!important;padding:2px 5px!important;border-radius:6px!important}
.leaflet-control-zoom{border:none!important;margin-right:10px!important;margin-bottom:10px!important}
.leaflet-control-zoom a{background:var(--btn-bg)!important;color:var(--text)!important;border:1px solid var(--border)!important;width:34px!important;height:34px!important;line-height:34px!important;font-size:16px!important;border-radius:10px!important;margin-bottom:4px!important}
.settlement-marker{background:transparent;border:0}
.settlement-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;border:1.5px solid #fff}
.settlement-dot.city{background:#16a34a;width:11px;height:11px;border-width:2px}
.infra-marker{background:transparent;border:0}
.infra-bridge{width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:14px;filter:drop-shadow(0 0 4px rgba(96,165,250,.9))}
.infra-energy{width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:14px;filter:drop-shadow(0 0 4px rgba(250,204,21,.9))}
.infra-incident{width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:14px;filter:drop-shadow(0 0 5px rgba(220,38,38,.95));animation:incPulse 1.6s ease-in-out infinite}
@keyframes incPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.infra-legend{position:absolute;bottom:calc(var(--safe-bottom) + 50px);right:6px;z-index:1050;background:rgba(7,16,24,.94);border:1px solid #1f3540;border-radius:8px;padding:6px 8px;font-size:9px;color:#cbd5e1;display:none;line-height:1.5}
.infra-legend.show{display:block}
.user-loc-marker{position:relative;width:22px;height:22px}
.user-loc-dot{position:absolute;inset:0;border-radius:50%;background:#22d3ee;border:3px solid #fff;box-shadow:0 0 0 2px rgba(34,211,238,.6),0 0 14px rgba(34,211,238,.9);animation:userPulse 2s ease-in-out infinite}
.user-loc-arrow{position:absolute;top:-12px;left:50%;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:12px solid #22d3ee;transform-origin:50% 23px}
@keyframes userPulse{0%,100%{box-shadow:0 0 0 2px rgba(34,211,238,.6),0 0 14px rgba(34,211,238,.9)}50%{box-shadow:0 0 0 8px rgba(34,211,238,.15),0 0 20px rgba(34,211,238,1)}}
.user-loc-accuracy{stroke:#22d3ee;fill:#22d3ee;fill-opacity:.08;stroke-opacity:.6;stroke-width:1.5}
@media (min-width: 700px){.panel{width:340px;left:6px;right:auto}.top-alert{left:6px;right:auto;width:380px}.mass-banner{left:6px;right:auto;width:380px}}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="logo"><span class="logo-icon">🛡</span><span>KYIV OSINT RADAR</span></div>
    <div class="header-right">
      <div class="ballistic-timer" id="ballisticTimer"></div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Пошук місця..." autocomplete="off" spellcheck="false">
        <button type="button" id="searchBtn">🔍</button>
      </div>
      <button type="button" class="lang-btn-header" id="btnLang">UA</button>
      <div class="status">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">ЗАГРУЗКА…</span>
      </div>
    </div>
  </div>
  <div class="search-results" id="searchResults"></div>
  <div id="map"></div>

  <div class="top-alert" id="topAlert">
    <button class="top-alert-close" id="topAlertClose">×</button>
    <div class="top-alert-inner">
      <div class="top-alert-icon" id="topAlertIcon">🚨</div>
      <div class="top-alert-body">
        <div class="top-alert-title" id="topAlertTitle">—</div>
        <div class="top-alert-place" id="topAlertPlace" style="display:none">—</div>

const CLASSIFIER = (() => {
  const HARD = [
    { re: /циркон|zircon|3м22/i, type: "zircon", label: "Циркон" },
    { re: /реактивн[а-яіїєґ]*\s*(шахед|геран|бпла|дрон)/i, type: "jet_drone", label: "Реакт. БПЛА / Шахед" },
    { re: /шахед|shahed/i, type: "jet_drone", label: "Шахед" },
    { re: /балістик|баллистик|балістич|іскандер|искандер|кинжал|кінжал|кн-?23/i, type: "ballistic", label: "Балістика" },
    { re: /калібр|калибр|kalibr|х-?\s*101|х-?\s*555/i, type: "missile", label: "Крилата ракета" },
    { re: /бандерол|s\s*8000/i, type: "banderol", label: "Бандероль S8000" },
    { re: /каб\b|kab\b/i, type: "kab", label: "КАБ" },
    { re: /оникс|оникс|oniks/i, type: "missile", label: "Онікс" },
    { re: /крилат[аиі]?\s+ракет/i, type: "missile", label: "Крилата ракета" }
  ];
  const SOFT = [
    { re: /розвідник|разведчик|recon/i, type: "recon", label: "Розвідник" },
    { re: /fpv|фпв/i, type: "fpv", label: "FPV" },
    { re: /герань|geran/i, type: "uav", label: "Герань" },
    { re: /бпла|дрон|беспилотник|безпілотник/i, type: "uav", label: "БПЛА" }
  ];
  return function(text) { text = text || ""; for (const r of HARD) if (r.re.test(text)) return { ...r, hard: true }; for (const r of SOFT) if (r.re.test(text)) return { ...r, hard: false }; return null; };
})();
function resolveSpeedKmh(type) { const F = { uav: 180, recon: 120, fpv: 80, geran2: 180, geran3: 190, geran4: 200, geran5: 220, jet_drone: 800, missile: 900, ballistic: 2100, banderol: 700, kab: 400, umpb: 500, zircon: 2500 }; return F[type] || 150; }
function etaToKyivMin(lat, lon, type, spd) { if (lat == null || lon == null) return null; const s = spd || resolveSpeedKmh(type); return haversineKm(lat, lon, CONFIG.KYIV[0], CONFIG.KYIV[1]) / s * 60; }

const BallisticTimer = (() => {
  let startedAt = 0, tickTimer = null;
  const DURATION = 120000;
  function render() {
    const el = $("ballisticTimer"); if (!el) return;
    const left = startedAt ? Math.max(0, DURATION - (Date.now() - startedAt)) : 0;
    if (!startedAt || left <= 0) { el.classList.remove("show"); el.textContent = ""; return; }
    const secs = Math.ceil(left / 1000);
    el.textContent = "🚨 " + secs + "s";
    el.classList.add("show");
    el.style.background = secs <= 20 ? "#7f1d1d" : (secs <= 60 ? "#b91c1c" : "#7c2d12");
  }
  function start(fromMs) {
    const now = Date.now();
    const ts = fromMs || now;
    if (now - ts > 5 * 60 * 1000) return;
    startedAt = ts;
    render();
    if (!tickTimer) tickTimer = setInterval(() => { render(); if (!startedAt || Date.now() - startedAt >= DURATION) { clearInterval(tickTimer); tickTimer = null; startedAt = 0; render(); } }, 300);
  }
  function isActive() { return !!startedAt && (Date.now() - startedAt) < DURATION; }
  return { start, isActive };
})();

/* ===== SYNC MESSAGES с 3-уровневым fallback ===== */
function syncMessageThreats(messages) {
  const now = Date.now();
  for (const m of (messages || [])) {
    const text = m.text || "";
    if (!text || text.length < 5) continue;
    const ch = m.channel || "unknown";
    const msgMs = m.date ? Date.parse(m.date) : (m.ts ? Date.parse(m.ts) : now);

    if (/балістик|баллистик|іскандер|кинжал|циркон|кн-?23|орешник|с-?400/i.test(text) && !/[?]|чи\s+мож/i.test(text)) {
      BallisticTimer.start(msgMs);
    }

    try { Stockpiles.autoHighlightFromText(text); } catch (e) {}

    const cls = CLASSIFIER(text);
    if (!cls) continue;

    const seedPlaces = m.places || [];
    const seedCoords = m.place_coords || {};
    const isSeed = m._seed === true;

    /* === SEED PATH === */
    if (isSeed && seedPlaces.length) {
      for (const pName of seedPlaces) {
        const c = seedCoords[pName];
        if (!c || !Number.isFinite(c.lat) || !Number.isFinite(c.lng)) continue;
        const key = `seed|${pName}|${cls.type}`;
        if (State.isDismissed(key) || State.msgMarkers.has(key)) continue;
        const place = { name: pName, lat: c.lat, lon: c.lng, _key: key };
        const eta = etaToKyivMin(c.lat, c.lng, cls.type);
        const marker = L.marker([c.lat, c.lng], { icon: makeIcon({ type: cls.type, _exactName: m.subtype }, false), zIndexOffset: 900 });
        marker.bindPopup(buildGenericPopup({ type: cls.type, _exactName: m.subtype }, place, eta, new Set([ch]), text, isSeed), CONFIG.POPUP_OPTS);
        marker.addTo(msgThreatLayer);
        State.msgMarkers.set(key, { _key: key, marker, cls, place, eta, isSeed: true, lastSeen: msgMs });
      }
      continue;
    }

    /* === REAL PATH с 3-уровневым fallback === */
    const key = `msg|${cls.type}|${text.slice(0, 40)}`;
    if (State.isDismissed(key) || State.msgMarkers.has(key)) continue;

    let place = null;
    let approx = false;

    /* Уровень 1: расширенная база UA городов */
    const ua = findUACity(text);
    if (ua) place = { name: ua.name, lat: ua.lat, lon: ua.lng, _key: key };

    /* Уровень 2: склад РФ */
    if (!place) {
      const stockpile = RU_STOCKPILES.find(s => text.toLowerCase().includes(s.name.toLowerCase().split(" ")[0].toLowerCase()));
      if (stockpile) place = { name: stockpile.name, lat: stockpile.lat, lon: stockpile.lng, _key: key };
    }

    /* Уровень 3: Киев с пометкой "приблизно" */
    if (!place) place = { name: "Київ (приблизно)", lat: CONFIG.KYIV[0], lon: CONFIG.KYIV[1], _key: key, _approx: true, approx: true };
    approx = !!place._approx;

    const marker = L.marker([place.lat, place.lon], { icon: makeIcon({ type: cls.type }, approx), zIndexOffset: 900 });
    marker.bindPopup(buildGenericPopup({ type: cls.type }, place, null, new Set([ch]), text, false), CONFIG.POPUP_OPTS);
    marker.addTo(msgThreatLayer);
    State.msgMarkers.set(key, { _key: key, marker, cls, place, eta: null, isSeed: false, approx, lastSeen: msgMs });
  }
  Feed.schedule();
}

function removeMarkerByKey(kind, key) {

const Feed = (() => {
  let timer = null;
  function schedule() { if (timer) return; timer = setTimeout(() => { timer = null; render(); }, 300); }
  function iconFor(item) {
    const ty = item.cls?.type || "";
    if (ty === "zircon" || ty === "ballistic") return "🚨";
    if (ty === "jet_drone") return "⚡";
    if (["geran2","geran3","geran4","geran5"].includes(ty)) return "🛸";
    if (["missile","kab","banderol"].includes(ty)) return "🚀";
    if (ty === "recon") return "👁";
    if (["uav","fpv"].includes(ty)) return "🛸";
    return "📍";
  }
  function colorFor(item) {
    const ty = item.cls?.type || "";
    if (ty === "zircon" || ty === "ballistic") return "#d94a8c";
    if (["jet_drone","geran2","geran3","geran4","geran5"].includes(ty)) return "#dc2626";
    if (["missile","kab","banderol"].includes(ty)) return "#e55757";
    if (ty === "recon") return "#3b82f6";
    if (["uav","fpv"].includes(ty)) return "#facc15";
    return "#4ca9e8";
  }
  function collect() {
    const out = [];
    for (const o of State.msgMarkers.values()) {
      if (!o.marker) continue;
      const ll = o.marker.getLatLng(); if (!ll) continue;
      out.push({ id: o._key, cls: { type: o.cls.type, label: o.cls._exactName || getMeta(o.cls.type).label }, name: o.place.name, lat: ll.lat, lng: ll.lng, eta: o.eta, ts: o.lastSeen || Date.now(), isSeed: !!o.isSeed, approx: !!o.approx });
    }
    out.sort((a, b) => b.ts - a.ts);
    return out;
  }
  function render() {
    const cont = $("events"), cnt = $("eventCount"); if (!cont) return;
    const items = collect();
    if (cnt) cnt.textContent = items.length + " подій";
    if (!items.length) { cont.innerHTML = `<div class="panel-empty">Немає активних подій</div>`; return; }
    cont.innerHTML = items.slice(0, 60).map((it, idx) => {
      const color = colorFor(it);
      const icon = iconFor(it);
      const time = new Date(it.ts).toLocaleTimeString("uk-UA", { hour: "2-digit", minute: "2-digit" });
      let tags = "";
      if (it.isSeed) tags += `<span class="tag seed">📚 SEED</span>`;
      if (it.approx) tags += `<span class="tag approx">⚠ ПРИБЛИЗНО</span>`;
      if (it.eta != null) tags += `<span class="tag">⏱ ${formatEta(it.eta)}</span>`;
      return `<div class="event" data-idx="${idx}" style="border-left-color:${color}"><div class="event-top"><div class="event-type" style="color:${color}"><span class="event-icon">${icon}</span>${esc(it.cls.label)}</div><div class="event-time">${time}</div></div><div class="event-loc">📍 ${esc(it.name)}</div>${tags ? `<div class="event-meta">${tags}</div>` : ''}</div>`;
    }).join("");
    cont.querySelectorAll(".event").forEach(el => el.addEventListener("click", () => {
      const it = items[+el.getAttribute("data-idx")];
      if (it && it.lat != null) map.setView([it.lat, it.lng], 13, { animate: true });
    }));
  }
  return { schedule, render, collect, iconFor, colorFor };
})();

const SeedLoader = (() => {
  const KEY = "kyiv_seed_seen_v6";
  let seen = new Set();
  try { const raw = localStorage.getItem(KEY); seen = new Set(raw ? JSON.parse(raw) : []); } catch (e) { seen = new Set(); }
  function saveSeen() { try { localStorage.setItem(KEY, JSON.stringify([...seen].slice(-1000))); } catch (e) {} }
  function hashKey(m) { return (m.text || "").slice(0, 100).toLowerCase().replace(/\s+/g, " ") + "|" + ((m.ts || "").slice(0, 16)); }
  function run() {
    const arr = window.SEED_MESSAGES;
    if (!Array.isArray(arr) || !arr.length) { console.info("[seed] пусто"); return; }
    const fresh = [];
    for (const m of arr) {
      const k = hashKey(m);
      if (seen.has(k)) continue;
      seen.add(k);
      fresh.push(m);
    }
    saveSeen();
    if (!fresh.length) return;
    const mapped = fresh.map(r => ({ text: r.text, channel: "seed", ts: r.ts, date: r.ts, type: r.type, subtype: r.subtype, places: r.places, place_coords: r.place_coords, stage: r.stage, _seed: true }));
    syncMessageThreats(mapped);
    showToast(`📚 Завантажено ${fresh.length} seed`, 2500);
  }
  function reset() { seen = new Set(); try { localStorage.removeItem(KEY); } catch (e) {} }
  return { run, reset };
})();

const Net = (() => {
  let ws = null, wsConnected = false, pollTimer = null;
  function connect() {
    try {
      if (ws) { try { ws.close(); } catch (e) {} ws = null; }
      ws = new WebSocket(CONFIG.WS_URL);
      ws.onopen = () => { wsConnected = true; $("statusText").textContent = "ONLINE · WS"; $("statusDot").className = "status-dot"; };
      ws.onerror = () => {};
      ws.onclose = () => { wsConnected = false; ws = null; $("statusText").textContent = "ОФЛАЙН"; $("statusDot").className = "status-dot err"; startPolling(); setTimeout(connect, 5000); };
    } catch (e) { startPolling(); }
  }
  async function fetchMessages() {
    try {
      const r = await fetch(CONFIG.API_MESSAGES);
      if (!r.ok) return;
      const d = await r.json();
      const arr = (d.messages || []).map(m => ({ text: m.text, channel: m.channel, date: m.date }));
      if (arr.length) syncMessageThreats(arr);
    } catch (e) {}
  }
  async function pollLoop() { await fetchMessages(); pollTimer = setTimeout(pollLoop, CONFIG.POLL_MS); }
  function startPolling() { if (pollTimer) clearTimeout(pollTimer); pollLoop(); }
  function stopPolling() { if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; } }
  return { connect, startPolling, stopPolling, fetchMessages, isConnected: () => wsConnected };
})();

function initSearch() {
  const input = $("searchInput"), btn = $("searchBtn"), results = $("searchResults");
  if (!input || !btn || !results || !map) return;
  let searchMarker = null, debounceTimer = null;
  function hide() { results.classList.remove("show"); results.innerHTML = ""; }
  async function doSearch(q) {
    q = (q || "").trim();
    if (q.length < 2) { hide(); return; }
    try {
      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=8&accept-language=uk,en`;
      const r = await fetch(url);
      const data = await r.json();
      const items = (data || []).map(d => ({ name: d.display_name.split(",")[0], addr: d.display_name, lat: +d.lat, lon: +d.lon })).filter(x => Number.isFinite(x.lat));
      if (!items.length) { hide(); return; }
      results.innerHTML = items.map((it, i) => `<div class="search-item" data-idx="${i}"><div class="name">${esc(it.name)}</div><div class="addr">${esc(it.addr)}</div></div>`).join("");
      results.classList.add("show");
      results.querySelectorAll(".search-item").forEach(el => el.addEventListener("click", () => {
        const it = items[+el.dataset.idx]; if (!it) return;
        map.setView([it.lat, it.lon], 14, { animate: true });
        if (searchMarker) map.removeLayer(searchMarker);
        searchMarker = L.marker([it.lat, it.lon]).addTo(map).bindPopup(`<b>${esc(it.name)}</b>`).openPopup();
        hide(); input.blur();
      }));
    } catch (e) { hide(); }
  }
  btn.addEventListener("click", () => doSearch(input.value));
  input.addEventListener("keydown", e => { if (e.key === "Enter") doSearch(input.value); if (e.key === "Escape") { hide(); input.value = ""; } });
  input.addEventListener("input", () => { clearTimeout(debounceTimer); debounceTimer = setTimeout(() => doSearch(input.value), 400); });
  document.addEventListener("click", e => { if (!results.contains(e.target) && e.target !== input && e.target !== btn) hide(); });
}

function initUserMarkers() {
  const KEY = "kyiv_user_markers_v3";

  const btn = $("btnMarkers");
  if (!btn || !map) return;
  try { markers = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { markers = []; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(markers)); } catch (e) {} }
  function icon() { return L.divIcon({ className: "", html: `<div style="background:#ea580c;width:18px;height:18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5)"></div>`, iconSize: [18,18], iconAnchor: [9,18] }); }
  function render() {
    if (!layer) layer = L.layerGroup().addTo(map);
    layer.clearLayers();
    markers.forEach(m => {
      const mk = L.marker([m.lat, m.lng], { icon: icon(), draggable: true }).bindPopup(`<b>${esc(m.title || "Мітка")}</b><br><small>${m.lat.toFixed(4)}, ${m.lng.toFixed(4)}</small><br><button type="button" class="popup-remove-btn" data-remove-kind="user" data-remove-key="${esc(m.id)}">🗑 Видалити</button>`).addTo(layer);
      mk.on("dragend", () => { const ll = mk.getLatLng(); m.lat = ll.lat; m.lng = ll.lng; save(); });

    const m = { id: Date.now() + "_" + Math.random().toString(36).slice(2,6), lat: e.latlng.lat, lng: e.latlng.lng, title: "Мітка" };
    markers.push(m); save(); render();
    addMode = false; btn.classList.remove("on"); map.getContainer().style.cursor = "";

    const b = e.target.closest('.popup-remove-btn[data-remove-kind="user"]');
    if (!b) return;

}

const GeoLoc = (() => {
  let watchId = null, marker = null, accuracyCircle = null, lastPos = null, enabled = false, headingDeg = null, lastCoords = null, orientationHandler = null;
  function makeIcon() {
    const arrow = headingDeg != null ? `<div class="user-loc-arrow" style="transform:translateX(-50%) rotate(${headingDeg}deg)"></div>` : "";
    return L.divIcon({ className: "", html: `<div class="user-loc-marker">${arrow}<div class="user-loc-dot"></div></div>`, iconSize: [22,22], iconAnchor: [11,11] });
  }
  function onPosition(pos) {
    lastPos = pos;
    const lat = pos.coords.latitude, lon = pos.coords.longitude;
    lastCoords = { lat, lon };
    const acc = pos.coords.accuracy || 0;
    if (pos.coords.heading != null && !isNaN(pos.coords.heading) && pos.coords.speed > 0.5) headingDeg = pos.coords.heading;
    if (!marker) {
      marker = L.marker([lat, lon], { icon: makeIcon(), zIndexOffset: 3000 });
      marker.bindPopup(`<div class="popup-title">🧭 Моє місцезнаходження</div><div class="popup-meta">${lat.toFixed(5)}, ${lon.toFixed(5)}<br>±${Math.round(acc)} м</div>`);
      marker.addTo(map);
    } else { marker.setLatLng([lat, lon]); marker.setIcon(makeIcon()); }
    if (!accuracyCircle) { accuracyCircle = L.circle([lat, lon], { radius: acc, className: "user-loc-accuracy", interactive: false }); accuracyCircle.addTo(map); }
    else { accuracyCircle.setLatLng([lat, lon]); accuracyCircle.setRadius(acc); }
    _userPos = { lat, lon };
    try { refreshNearUserIcons(); } catch (e) {}
  }
  function onError() { showToast("🧭 Помилка геолокації", 3000); }
  function startOrientation() {
    if (orientationHandler) return;
    const handler = (e) => { let h = null; if (e.webkitCompassHeading != null) h = e.webkitCompassHeading; else if (e.alpha != null) h = 360 - e.alpha; if (h != null && !isNaN(h)) { headingDeg = h; if (marker) marker.setIcon(makeIcon()); } };
    orientationHandler = handler;
    window.addEventListener("deviceorientationabsolute", handler, true);
    window.addEventListener("deviceorientation", handler, true);
  }
  function start() {
    if (!("geolocation" in navigator)) { showToast("🧭 Геолокація недоступна"); return; }
    if (watchId != null) return;
    watchId = navigator.geolocation.watchPosition(onPosition, onError, { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
    enabled = true; $("btnGeo").classList.add("on"); showToast("🧭 Увімкнено");
    if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === "function") { DeviceOrientationEvent.requestPermission().then(p => { if (p === "granted") startOrientation(); }).catch(() => {}); }
    else startOrientation();
  }
  function stop() {
    if (watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    enabled = false; $("btnGeo").classList.remove("on");
    if (marker) { map.removeLayer(marker); marker = null; }
    if (accuracyCircle) { map.removeLayer(accuracyCircle); accuracyCircle = null; }
    _userPos = null; refreshNearUserIcons();
    if (orientationHandler) { window.removeEventListener("deviceorientationabsolute", orientationHandler, true); window.removeEventListener("deviceorientation", orientationHandler, true); orientationHandler = null; }
  }
  function toggle() { enabled ? stop() : start(); }
  function center() { if (!lastPos) { showToast("🧭 Позиція не визначена"); return; } map.setView([lastPos.coords.latitude, lastPos.coords.longitude], Math.max(map.getZoom(), 15), { animate: true }); }
  return { start, stop, toggle, center, isEnabled: () => enabled, getLast: () => lastCoords };
})();
